# 필받음 웹 사이트맵(07 단계 원본).
# - 이 파일이 원본이고, 사람이 보는 그림(보드·목록·슬라이드)은 draw.py로 이 파일에서 그림. 그림을 손으로 고치지 않음.
# - PM이 2026-11-05 "Git에 원본 두기"를 고름. 10/21 사이트맵 Artifact(v2)는 옛 판으로 남김.
# - 화면 ID는 팀 화면 원장(Notion)과 목업 v2 보드의 ID를 그대로 씀. 번호를 다시 매기거나 없앤 번호를 다시 쓰지 않음.
# - 경로 출처: react-client/src/paths.js · router.js (develop 5af1fdd).
#
# 칸 뜻
# - kind: page(주소가 있는 화면) · view(같은 주소 안에서 바뀌는 화면. 상태 모양은 08 단계 화면 정의에 둠)
#         · window(주소 없는 창·패널) · outside(앱 밖, 예: 크롬 푸시)
# - path: page만 가짐(라우트 모양, 쿼리 제외). 두 화면이 같은 path를 쓰지 않음. 나머지는 null이고 at에 나오는 곳을 적음.
# - access: 비회원(GuestLayout, 로그인 상태로 들어오면 홈으로 보냄) · 회원(MemberLayout) · 누구나(PublicLayout)
#   회원 화면에 로그인 없이 오면 만료는 CMN-03, 홈은 MEM-01, 그 밖은 MEM-04(돌아올 곳 기억)로 보냄(Layout.jsx).
# - status: active · removed(ID와 이력만 남기고 주소는 없음)
# - also_in: 같은 화면이 다른 부모 아래에서도 나올 때 그 부모 ID. 그림에는 첫 부모 아래 한 번만 그림.
# - added: 10/21 사이트맵 뒤에 Git에 더한 날짜(그 화면의 첫 커밋 날짜).
# - terms: 도메인(docs/01-domain/domain.md)의 맥락·용어 ID
#
# 화면이 없는 용어: TERM-007·TERM-008·TERM-009·TERM-011(CTX-007 진료 일정, DEC-036으로 하지 않음)
#                  TERM-012·TERM-014·TERM-015(카카오톡 안에서만 씀)
# 웹 화면이 없는 흐름: V3-FL-24·V3-FL-25·V3-FL-26(카카오톡 안에서만 진행), V3-FL-27·V3-FL-28·V3-FL-29(진료 일정, DEC-036으로 하지 않음)
# 화면 ID가 없는 것: 헤더 '설정' 메뉴(프로필 관리 PRF-01 · 알림 NTF-01 · 업데이트 기록 CMN-04로 가는 링크 묶음),
#                   홈의 로그아웃 확인창(CMN-01 안의 확인창). 회원 탈퇴 화면은 웹에 없음(V3-FL-32 탈퇴 갈래).

- id: CMN-01
  name: 홈
  kind: page
  path: /
  access: 회원
  status: active
  flows: []
  terms: [CTX-002, CTX-006]
  note: 오늘 먹을 약과 관리할 사람을 보여 줌. 로그아웃 확인창이 이 화면 안에 있음.
  children:
    - id: MEM-01
      name: 시작
      kind: page
      path: /welcome
      access: 비회원
      status: active
      flows: []
      terms: [CTX-001]
      note: 로그인하지 않고 홈에 오면 이 화면으로 보냄. 아래쪽에 업데이트 기록(CMN-04) 링크가 있음.
      children:
        - id: MEM-02
          name: 회원가입 약관 동의
          kind: page
          path: /signup
          access: 비회원
          status: active
          flows: [FL-01]
          terms: [CTX-001]
          children:
            - id: MEM-03
              name: 회원가입 정보 입력
              kind: page
              path: /signup/info
              access: 비회원
              status: active
              flows: [FL-01]
              terms: [CTX-001]
              note: 가입을 마치면 첫 프로필 만들기(PRF-02)로 감.
        - id: MEM-04
          name: 로그인
          kind: page
          path: /login
          access: 비회원
          status: active
          flows: [FL-02]
          terms: [CTX-001]
    - id: CMN-03
