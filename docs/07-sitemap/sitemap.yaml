      access: 비회원
      status: active
      flows: [FL-02, V3-FL-17]
      terms: [CTX-001]
      note: 회원 화면에서 로그인이 만료되면 이 화면으로 보냄. 다시 로그인(MEM-04)으로 이어짐.
    - id: CMN-02
      name: 권한 없음 · 찾을 수 없음
      kind: page
      path: "*"
      access: 회원
      status: active
      flows: []
      terms: none
      note: 403·404 오류 화면. 없는 대화방(CMN-02-01)은 같은 화면의 다른 문구임(ErrorScreen.jsx).
    - id: CMN-04
      name: 업데이트 기록
      kind: page
      path: /changelog
      access: 누구나
      status: active
      flows: []
      terms: none
      also_in: [MEM-01]
      added: 2026-11-04
      note: 회원은 헤더 '설정' 메뉴, 비회원은 시작 화면 아래쪽 링크로 들어옴(react-client/design/cmn-04-changelog.md).
    - id: PRF-04
      name: 관리할 사람 고르기
      kind: window
      path: null
      at: 헤더 '관리할 사람' 버튼. 홈·약 목록·약 등록·대화에서는 바꿀 수 있고, 약 검색·사진 등록에서는 보이지만 잠김.
      access: 회원
      status: active
      flows: []
      terms: [CTX-002]
