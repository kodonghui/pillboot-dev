openapi: 3.1.0
info:
  title: 필받음 v3 신규·변경 API
  version: v3-draft
  description: |
    v3에서 새로 생기거나 응답이 바뀌는 경로만 둠. 나머지 경로와 스키마는 실행 서버 사본
    `pillbadeum-server/docs/openapi.json`이 기준임. 구현 뒤 사본을 다시 받아 맞춤.
    기존 JSON 칸과 물리명은 바꾸지 않고, 새 칸은 기존 칸 뒤에 더함(V3-DRUG-004).
    오류 응답은 기존 공통 오류 모양(`ErrorResponse`)과 오류 코드를 그대로 씀.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: 약 검색
  - name: 내 약
  - name: 프로필
  - name: 사진 판독
  - name: 약봉이 제안
  - name: 약봉이 답변
paths:
  /api/drugs/search:
    get:
      tags: [약 검색]
      operationId: searchDrugs
      summary: 약 이름 검색(V3-REG-001 변경)
      description: |
        검색어에 함량이 있고 함량을 뗀 기본 이름이 2자 이상이면 기본 이름으로 허가정보를 조회함.
        기본 이름 결과가 없으면 원래 검색어로 한 번 더 조회함. 기본 이름으로 조회할 때는 결과 앞 100개 안에서
        함량 일치 후보를 앞에 두고 그 순서로 페이지를 나눔. 함량이 없는 검색어는 기존과 같음.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 50 } }
        - { name: profileId, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageResponseDrugSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/drugs/{itemSeq}:
    get:
      tags: [약 검색]
      operationId: getDrug
      summary: 약 정보(V3-DRUG-004 칸 추가)
      parameters:
        - { name: itemSeq, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 약 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugInfoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/profiles/{profileId}/drugs:
    get:
      tags: [내 약]
      operationId: listMyDrugs
      summary: 내 약 목록(V3-DRUG-004 칸 추가)
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 최근 등록순 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyDrugListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [내 약]
      operationId: registerMyDrugs
      summary: 내 약 저장(V3-CHAT-003, 등록 방법 값 CHAT은 받지 않음)
      description: |
        요청·응답·다른 오류는 기존과 같음(openapi.json). 등록 방법(`DrugSource`) 값 목록에 `CHAT`이 생기지만, `CHAT`은
        등록 제안 확정(`POST /api/chat-proposals/{proposalId}/confirm`)으로만 저장됨. 이 경로(`drugs`·`items` 방식 모두)와
        옛 경로 `POST /api/images/profiles/{profileId}/drugs`로 `CHAT`을 보내면 400이고 아무것도 저장하지 않음.
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '400':
          description: 기존 입력 오류와 함께, `source`가 `CHAT`이면 `VALIDATION_FAILED`
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/profiles/{profileId}/drugs/{myDrugId}:
    get:
      tags: [내 약]
      operationId: getMyDrug
      summary: 내 약 상세(V3-DRUG-004, drug 안의 칸 추가)
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: myDrugId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 내 약 상세. `drug`는 DrugInfoResponse와 같은 모양
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyDrugDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/profiles/{profileId}/drugs/bulk-delete:
    post:
      tags: [내 약]
      operationId: bulkDeleteMyDrugs
      summary: 약목록 여러 개 삭제(V3-DRUG-003)
      description: |
        고른 약목록 약 1~50개를 한 트랜잭션에서 지움. 복약 일정·알림은 약목록 약 행의 일정 칸에서 나오므로 약과 함께 없어짐.
        하나라도 이 프로필의 약이 아니거나 이미 없으면 404이고 아무것도 지우지 않음. 같은 요청을 다시 보내면 첫 요청이
        지웠으므로 404임(화면은 목록을 다시 불러옴). 다른 회원의 프로필도 없는 프로필처럼 404임(V3-COMMON-003).
        본문 있는 DELETE는 중간 장치가 본문을 버릴 수 있어 POST로 둠. 한 건 삭제 `DELETE .../drugs/{myDrugId}`는 그대로임.
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MyDrugBulkDeleteRequest' }
      responses:
        '200':
          description: 고른 약을 모두 지움
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyDrugBulkDeleteResponse' }
        '400':
          description: 본문 없음·빈 목록·51개 이상·빈 ID·중복 ID(`VALIDATION_FAILED`). 아무것도 지우지 않음
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 프로필·다른 회원의 프로필, 또는 고른 약 중 하나라도 이 프로필에 없음(`NOT_FOUND`). 아무것도 지우지 않음
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/profiles:
    post:
      tags: [프로필]
      operationId: createProfile
      summary: 프로필 만들기(V3-COMMON-004, 관계 값 OTHER 추가)
      description: 기존 요청·응답 모양 그대로이며 relationshipType에 `OTHER`('지인·기타')를 받음. 목록 밖 값은 기존처럼 400임
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '201':
          description: 만든 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/profiles/{profileId}:
    put:
      tags: [프로필]
      operationId: updateProfile
      summary: 프로필 고치기(V3-COMMON-004, 관계 값 OTHER 추가)
      description: 기존 요청·응답 모양 그대로이며 relationshipType에 `OTHER`를 받음. 다른 회원의 프로필은 기존처럼 404임
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '200':
          description: 고친 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/profiles/{profileId}/photo-identifications:
    post:
      tags: [사진 판독]
      operationId: identifyPhoto
      summary: 처방전·약봉투 사진 판독(V3-REG-002 후보 칸 추가)
      description: |
        요청과 오류는 기존과 같음(openapi.json). 처방전·약봉투(`kind=PRESCRIPTION`, 기본값)일 때만 응답이 늘어남.
        판독 이름에 함량이 있고 함량을 뗀 기본 이름이 2자 이상이면 기본 이름으로 먼저 조회해, 기본 이름(제형·서방·장용 포함)이
        같고 함량만 다른 품목도 '함량 다름'(DIFFERENT)으로 후보에 남김. 후보는 일치·확인 불가·다름 순이며 이름마다 최대 5개임.
        농도·활성 단위 표기나 잘린 이름은 기존 대조(REG-003)를 그대로 씀. 알약(`kind=PILL`) 응답은 바꾸지 않음.
        같은 처리의 옛 경로 `POST /api/images/profiles/{profileId}/prescription-photo/identify`도 같은 응답임.
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [PRESCRIPTION, PILL], default: PRESCRIPTION } }
      responses:
        '200':
          description: 판독 결과. 처방전은 읽은 이름마다 후보 묶음(drugs)을 돌려줌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionPhotoResponse' }
  /api/photos/{photoId}/candidates:
    get:
      tags: [사진 판독]
      operationId: getPhotoCandidates
      summary: 저장된 사진 후보 다시 보기(V3-REG-002 후보 칸 추가)
      description: |
        처방전 사진은 판독 때 저장한 후보를 다시 돌려주며, 함량 상태와 자동 선택은 저장된 판독 이름과 후보 품목명으로 다시 계산함
        (판독 응답과 같은 값). 알약 사진 응답은 바꾸지 않음.
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 저장된 후보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionPhotoResponse' }
  /api/chat-sessions/{sessionId}/messages:
    post:
      tags: [약봉이 제안]
      operationId: submitQuestion
      summary: 질문 보내기(V3-CHAT-002·007 답변에 제안 카드 칸 추가)
      description: |
        요청·결과 종류·오류는 기존과 같음(openapi.json). 질문이 등록 요청·일정 요청으로 갈리고(V3-CHAT-001) 제안을 만들었으면
        `ANSWERED` 답변의 `answer.proposal`에 카드가 옴. 답변 글(`answer.content`)은 카드를 설명하는 문장임. 후보를 찾지 못했거나
        공공데이터 장애, 대상 약을 하나로 못 정함, 해석 값이 규칙 밖이면 제안 없이 그 안내를 답변 글로 주고 `proposal`은 null임.
        약 질문 답변은 기존과 같고 `proposal`은 null임. 같은 칸이 `POST .../messages/{messageId}/retry` 응답에도 생김.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 기존 QuestionResponse에서 `answer`에 `proposal` 칸만 더함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionResponse' }
    get:
      tags: [약봉이 제안]
      operationId: readMessages
      summary: 상담 기록(V3-CHAT-002·007 메시지에 제안 카드 칸 추가)
      description: |
        요청·오류는 기존과 같음(openapi.json). 제안 카드를 보여 주는 약봉이 메시지에 `proposal`이 오고, 상태는 읽는 때의 값임
        (대기인데 만료 시각이 지났으면 EXPIRED). 다른 메시지의 `proposal`은 null임.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 기존 MessageHistoryResponse에서 `messages[]`에 `proposal` 칸만 더함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageHistoryResponse' }
  /api/chat-sessions/{sessionId}/messages/stream:
    post:
      tags: [약봉이 답변]
      operationId: submitQuestionStream
      summary: 질문 보내기 · 진행 단계를 SSE로 받기(V3-CHAT-008)
      description: |
        요청 본문·처리·결과는 `POST /api/chat-sessions/{sessionId}/messages`와 같음. 다른 점은 응답이 `text/event-stream`이고
        답을 만드는 동안 서버가 실제로 들어선 단계를 `stage` 이벤트로 먼저 보내는 것임(DEC-021). 답 글은 나눠 보내지 않고
        검증·저장을 마친 뒤 `result` 하나로 보냄. 카카오 중계는 기존 JSON 경로를 그대로 씀.

        - 이벤트 순서: `stage` 0개 이상 → `result` 또는 `error` 하나 → 스트림 닫힘. 단계는 UNDERSTANDING(질문 살펴보기) →
          FINDING_DRUG(약 찾기) → CHECKING(공식 자료·금기 확인) → WRITING(답 정리) 순서 안에서 질문에 따라 건너뜀.
          막힌 질문은 UNDERSTANDING만, 기록 질문은 UNDERSTANDING·WRITING만 옴. 화면은 모르는 단계 값을 무시함.
        - `result`의 data는 JSON 경로의 200 본문(`QuestionResponse`, ANSWERED·BLOCKED)과 같음.
        - `error`의 data는 같은 실패에 JSON 경로가 주는 상태·코드·문구(`QuestionStreamError`). 질문을 저장한 뒤 답변을 만들지 못한
          503에만 `questionMessageId`가 있음(같은 질문을 `.../retry/stream`으로 다시 보냄).
        - 스트림을 열기 전 오류(401 로그인, 400 입력, 403·404 상담방, 409 이미 답하는 중)는 기존과 같은 JSON 오류 응답임.
        - 이벤트가 없는 동안 15초마다 주석 줄(`: keep-alive`)이 옴. 화면 연결이 끊겨도 서버는 답을 끝까지 만들어 저장하고,
          화면은 기존처럼 상담 기록으로 저장 여부를 확인함. 서버 처리 한도 85초, 스트림 한도 95초.
        - `Authorization` 헤더가 필요해 브라우저 `EventSource`가 아닌 `fetch`로 읽음. `Accept: text/event-stream, application/json`.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionRequest' }
      responses:
        '200':
          description: SSE 스트림. 이벤트 이름별 data 모양은 `QuestionStreamStage`·`QuestionResponse`·`QuestionStreamError`
          headers:
            X-Accel-Buffering:
              description: 중간 프록시가 이벤트를 모아 두지 않게 함
              schema: { type: string, enum: ['no'] }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event:stage
                data:{"stage":"UNDERSTANDING"}

                event:stage
                data:{"stage":"FINDING_DRUG"}

                event:stage
                data:{"stage":"CHECKING"}

                event:stage
                data:{"stage":"WRITING"}

                event:result
                data:{"result":"ANSWERED","question":{"messageId":100,"turnNo":3},"answer":{"messageId":101,"turnNo":3,"content":"…","durNotice":null,"createdAt":"2026-11-02T19:30:00+09:00","proposal":null},"notice":null}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 다른 회원의 상담방(기존과 같음)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 상담방의 이전 질문에 답하는 중(REQUEST_IN_PROGRESS). 질문을 저장하지 않음
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/chat-sessions/{sessionId}/messages/{messageId}/retry/stream:
    post:
      tags: [약봉이 답변]
      operationId: retryQuestionStream
      summary: 다시 보내기 · 진행 단계를 SSE로 받기(V3-CHAT-008)
      description: |
        `POST /api/chat-sessions/{sessionId}/messages/{messageId}/retry`(본문 없음)와 같은 처리를 하고, 응답 모양은
        `.../messages/stream`과 같음. 다시 보낼 수 없는 질문(RETRY_NOT_ALLOWED 400)은 스트림 안의 `error` 이벤트로 옴.
        스트림을 열기 전 오류는 401·400(ID 형식)·403·404·409 JSON 오류임.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: SSE 스트림(`.../messages/stream`과 같은 이벤트)
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 다른 회원의 상담방(기존과 같음)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 상담방의 이전 질문에 답하는 중(REQUEST_IN_PROGRESS)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  /api/chat-proposals/{proposalId}:
    get:
      tags: [약봉이 제안]
      operationId: getChatProposal
      summary: 제안 카드 다시 보기(V3-CHAT-002·005·007)
      description: |
        대화 속 등록 제안·일정 제안의 지금 상태를 돌려줌. 대기(PENDING)인데 만료 시각이 지났으면 저장된 값과 관계없이
        만료(EXPIRED)로 돌려줌(V3-CHAT-005). 없는 제안과 다른 회원의 제안은 같은 404임(V3-COMMON-003).
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 제안 카드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatProposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chat-proposals/{proposalId}/confirm:
    post:
      tags: [약봉이 제안]
      operationId: confirmChatProposal
      summary: 제안 확정(V3-CHAT-003·005·007)
      description: |
        등록 제안은 고른 항목(`itemNos`)만 등록 방법 `CHAT`으로 약목록에 저장함. 일정 제안은 본문 없이 보내며 대상 약의 일정을
        카드의 '바뀐 뒤'로 저장함. 상태 변경과 저장은 한 트랜잭션이고, 대기이며 만료 전인 제안만 확정됨. 같은 제안을 동시에 두 번
        확정해도 하나만 성공하고 다른 하나는 409임. 실패하면 아무것도 저장하지 않음.
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatProposalConfirmRequest' }
      responses:
        '200':
          description: 확정함. 등록 제안은 고른 항목의 `chosen`이 true이고 `myDrugId`가 생김
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatProposal' }
        '400':
          description: |
            `VALIDATION_FAILED`. 등록 제안에서 `itemNos`가 없거나 비었거나 11개 이상·중복이거나, 제안에 없는 번호이거나,
            '이미 등록됨'(`alreadyRegistered`) 항목을 고름. 일정 제안에 `itemNos`를 보냄. 아무것도 저장하지 않음
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            확정할 수 없음. 아무것도 저장하지 않으며 본문의 `proposal`은 지금 상태임.
            - `PROPOSAL_ALREADY_CONFIRMED`: 이미 확정된 제안. `proposal`이 처음 확정 결과임(V3-REQ-49)
            - `PROPOSAL_CANCELLED`: 취소된 제안
            - `PROPOSAL_EXPIRED`: 만든 지 30분이 지남
            - `CONFLICT`: 등록 제안을 만든 뒤 고른 약이 다른 경로로 약목록에 먼저 저장됨. 제안은 대기 그대로임
            - `SCHEDULE_CHANGED`: 일정 제안을 만든 뒤 대상 약의 일정이 바뀌었거나 대상 약이 지워짐. 새 카드를 받아야 함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatProposalConflict' }
  /api/chat-proposals/{proposalId}/cancel:
    post:
      tags: [약봉이 제안]
      operationId: cancelChatProposal
      summary: 제안 취소(V3-CHAT-004)
      description: |
        대기인 제안을 취소로 바꾸고 아무것도 저장하지 않음. 이미 취소된 제안을 다시 취소하면 같은 결과로 200임.
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 취소함(또는 이미 취소됨)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatProposal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`PROPOSAL_ALREADY_CONFIRMED`·`PROPOSAL_EXPIRED`. 상태를 바꾸지 않음'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatProposalConflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    BadRequest:
      description: 입력 오류(INVALID_INPUT 등)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: 로그인 필요
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: 없음 또는 다른 회원의 대상(있는지 알려 주지 않음)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServiceUnavailable:
      description: 공공데이터 키 없음·호출 실패·시간 초과
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      description: 기존 공통 오류 모양. 칸 정의는 openapi.json과 GlobalExceptionHandler를 따름
      type: object
    StrengthMatch:
      type: string
      enum: [MATCH, DIFFERENT, UNKNOWN]
      description: |
        검색어 함량과 후보 함량의 비교. MATCH는 질량 함량이 같거나(μg로 비교) 복합·비질량 함량의 원문 글자가 같음.
        DIFFERENT는 둘 다 함량이 있지만 다름. UNKNOWN은 검색어나 후보에 함량이 없음.
    DrugStrengthFields:
      type: object
      properties:
        baseName:
          type: [string, 'null']
          maxLength: 50
          description: 함량과 괄호 성분명을 뗀 기본 이름. 예) '알프람정'
        strengthText:
          type: [string, 'null']
          maxLength: 50
          description: 품목명에 적힌 함량 원문. 예) '0.25밀리그램', '500/125mg'. 없으면 null
    DrugSearchResponse:
      allOf:
        - type: object
          required: [itemSeq, name, registered]
          properties:
            itemSeq: { type: string }
            name: { type: string }
            maker: { type: [string, 'null'] }
            imageUrl: { type: [string, 'null'] }
            registered: { type: boolean }
        - $ref: '#/components/schemas/DrugStrengthFields'
        - type: object
          required: [strengthMatch]
          properties:
            strengthMatch: { $ref: '#/components/schemas/StrengthMatch' }
    PageResponseDrugSearchResponse:
      type: object
      description: 기존 PageResponse 모양. content의 칸만 늘어남
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DrugSearchResponse' }
    DrugInfoResponse:
      description: 기존 칸(openapi.json의 DrugInfoResponse) 뒤에 baseName·strengthText를 더함
      allOf:
        - type: object
        - $ref: '#/components/schemas/DrugStrengthFields'
    MyDrugListResponse:
      description: 기존 칸 뒤에 baseName·strengthText를 더함. 직접 입력한 약은 둘 다 null. `source`에 `CHAT`이 올 수 있음
      allOf:
        - type: object
          properties:
            source: { $ref: '#/components/schemas/DrugSource' }
        - $ref: '#/components/schemas/DrugStrengthFields'
    MyDrugDetailResponse:
      description: 기존 모양 그대로이며, drug(DrugInfoResponse)에 baseName·strengthText가 생김. `source`에 `CHAT`이 올 수 있음
      type: object
      properties:
        source: { $ref: '#/components/schemas/DrugSource' }
        drug:
          oneOf:
            - $ref: '#/components/schemas/DrugInfoResponse'
            - type: 'null'
    MyDrugBulkDeleteRequest:
      type: object
      required: [myDrugIds]
      properties:
        myDrugIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, format: int64 }
          description: 지울 약목록 약 ID(`myDrugId`). 1~50개, 같은 ID는 한 번만
    MyDrugBulkDeleteResponse:
      type: object
      required: [deletedCount]
      properties:
        deletedCount:
          type: integer
          minimum: 1
          maximum: 50
          description: 지운 약 수. 성공하면 늘 고른 수와 같음
    RelationshipType:
      type: string
      enum: [SELF, MOTHER, FATHER, DAUGHTER, SON, GRANDMA, GRANDPA, SPOUSE, OTHER]
      description: 회원과 프로필의 관계. v3에서 `OTHER`(화면 이름 '지인·기타')를 더함. 저장 칸 `relationship_type` varchar(10)에 들어가 SQL 변경 없음
    ProfileRequest:
      description: 기존 ProfileCreateRequest·ProfileUpdateRequest(openapi.json)와 같은 칸이며 relationshipType 값 목록만 늘어남
      allOf:
        - type: object
        - type: object
          required: [relationshipType]
          properties:
            relationshipType: { $ref: '#/components/schemas/RelationshipType' }
    ProfileResponse:
      description: 기존 ProfileResponse(openapi.json)와 같은 칸이며 relationshipType에 OTHER가 올 수 있음
      allOf:
        - type: object
        - type: object
          properties:
            relationshipType: { $ref: '#/components/schemas/RelationshipType' }
    PrescriptionPhotoResponse:
      type: object
      description: 기존 PhotoIdentificationResponse 모양(openapi.json). 처방전의 drugs 칸만 늘어남
      properties:
        kind: { type: string, enum: [PRESCRIPTION, PILL] }
        photoId: { type: [integer, 'null'], format: int64 }
        status: { type: string }
        drugs:
          type: array
          items: { $ref: '#/components/schemas/PhotoDrugGroup' }
    PhotoDrugGroup:
      type: object
      required: [readNo, readName, lookup, candidates]
      properties:
        readNo: { type: integer }
        readName: { type: string, description: 사진에서 읽은 이름 원문 }
        lookup: { type: string, enum: [OK, PARTIAL, NOT_FOUND, FAILED] }
        candidates:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/PhotoCandidate' }
        autoSelectItemSeq:
          type: string
          description: |
            함량 일치(MATCH) 후보가 정확히 하나이고 그 후보가 이 프로필에 아직 등록되지 않았을 때만 그 품목코드를 줌.
            그 밖에는 칸이 없음(자동 선택하지 않음). 화면은 이 값을 미리 고른 상태로만 쓰고, 저장은 사용자가 확정할 때 함.
    PhotoCandidate:
      allOf:
        - type: object
          description: 기존 Candidate 칸(itemSeq·name·maker·etcOtc·imageUrl·cancelled·alreadyRegistered·printMatched 등)은 그대로임
          required: [itemSeq, name, alreadyRegistered]
          properties:
            itemSeq: { type: string }
            name: { type: string }
            alreadyRegistered: { type: boolean }
        - $ref: '#/components/schemas/DrugStrengthFields'
        - type: object
          required: [strengthMatch]
          properties:
            strengthMatch:
              $ref: '#/components/schemas/StrengthMatch'
              description: |
                판독 이름의 함량과 비교. 판독 이름에 함량이 없거나 잘려 읽혔으면 UNKNOWN.
                복합 함량(500/125mg)은 성분별 질량이 순서대로 같을 때, 농도는 단위 표기만 맞춘 원문이 같을 때만 MATCH.
    DrugSource:
      type: string
      enum: [SEARCH, PILL_PHOTO, PILL_CLUES, PRESCRIPTION_PHOTO, MANUAL, CHAT]
      description: |
        약목록 약의 등록 방법(`my_drug.source`). v3에서 `CHAT`('대화')을 더함. 저장 칸 varchar(30)에 들어가 SQL 구조 변경 없음.
        내 약 목록·상세 응답의 `source`에 `CHAT`이 올 수 있음.
    QuestionRequest:
      description: 기존 질문 본문. 회원 번호는 받지 않음
      type: object
      required: [content]
      properties:
        content: { type: string, description: '앞뒤 공백을 뗀 뒤 1~1,000자' }
    QuestionStreamStage:
      description: '`stage` 이벤트의 data. 서버가 실제로 들어선 단계'
      type: object
      required: [stage]
      properties:
        stage:
          type: string
          enum: [UNDERSTANDING, FINDING_DRUG, CHECKING, WRITING]
    QuestionStreamError:
      description: '`error` 이벤트의 data. 같은 실패에 JSON 경로가 주는 HTTP 상태·오류 코드·문구'
      type: object
      required: [status, code, message, questionMessageId]
      properties:
        status: { type: integer, examples: [503] }
        code: { type: string, examples: [EXTERNAL_TIMEOUT] }
        message: { type: string }
        questionMessageId:
          description: 질문을 저장한 뒤 답변을 만들지 못한 503에만 값이 있음
          oneOf:
            - { type: integer, format: int64 }
            - type: 'null'
    QuestionResponse:
      description: 기존 QuestionResponse(openapi.json)와 같은 칸이며 `answer`에 `proposal`이 생김
      type: object
      properties:
        answer:
          oneOf:
            - type: object
              properties:
                proposal:
                  oneOf:
                    - $ref: '#/components/schemas/ChatProposal'
                    - type: 'null'
            - type: 'null'
    MessageHistoryResponse:
      description: 기존 MessageHistoryResponse(openapi.json)와 같은 칸이며 `messages[]`에 `proposal`이 생김
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              proposal:
                oneOf:
                  - $ref: '#/components/schemas/ChatProposal'
                  - type: 'null'
    ChatProposal:
      type: object
      required: [proposalId, kind, status, profileId, messageId, createdAt, expiresAt, items]
      properties:
        proposalId: { type: integer, format: int64 }
        kind:
          type: string
          enum: [REGISTER, SCHEDULE]
          description: REGISTER는 등록 제안(V3-CHAT-002·006), SCHEDULE은 일정 제안(V3-CHAT-007)
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED]
          description: 대기 → 확정·취소·만료 한 방향. 대기인데 만료 시각이 지났으면 EXPIRED로 줌
        profileId: { type: integer, format: int64 }
        messageId:
          type: integer
          format: int64
          description: 카드를 보여 주는 약봉이 메시지
        createdAt: { type: string, format: date-time, description: '기존 메시지 시각처럼 +09:00' }
        expiresAt: { type: string, format: date-time, description: 만든 뒤 30분 }
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: 확정·취소·만료된 시각. 읽을 때 만료로 본 제안은 만료 시각
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ChatProposalItem' }
          description: 등록 제안의 항목. 일정 제안은 빈 배열
        schedule:
          oneOf:
            - $ref: '#/components/schemas/ChatProposalSchedule'
            - type: 'null'
          description: 일정 제안의 내용. 등록 제안은 null
    ChatProposalItem:
      allOf:
        - type: object
          required: [itemNo, itemSeq, name, strengthMatch, alreadyRegistered, chosen]
          properties:
            itemNo: { type: integer, minimum: 1, maximum: 10, description: 카드 안 순서. 확정 때 이 번호로 고름 }
            itemSeq: { type: string }
            name: { type: string, description: 품목명 }
            maker: { type: [string, 'null'] }
            imageUrl: { type: [string, 'null'] }
            mention:
              type: [string, 'null']
              maxLength: 100
              description: 대화·사진에서 읽은 이름·함량 원문. 예) '타이레놀 500'
            strengthMatch: { $ref: '#/components/schemas/StrengthMatch' }
            alreadyRegistered:
              type: boolean
              description: 제안을 만들 때 이미 이 프로필 약목록에 있었음. 고를 수 없음(V3-REQ-50)
            chosen: { type: boolean, description: 확정 때 고른 항목 }
            myDrugId:
              type: [integer, 'null']
              format: int64
              description: 확정으로 만든 약목록 약. 고르지 않았거나, 그 약을 뒤에 지웠으면 null
        - $ref: '#/components/schemas/DrugStrengthFields'
    ChatProposalSchedule:
      type: object
      required: [current, proposed]
      properties:
        myDrugId:
          type: [integer, 'null']
          format: int64
          description: 일정을 바꿀 약목록 약. 제안 뒤 그 약을 지웠으면 null이고 확정할 수 없음
        drugName: { type: [string, 'null'], description: 카드에 보일 약 이름 }
        current: { $ref: '#/components/schemas/ScheduleValues' }
        proposed: { $ref: '#/components/schemas/ScheduleValues' }
    ScheduleValues:
      type: object
      description: 카드의 '지금'·'바뀐 뒤' 일정. 칸 이름은 기존 복약 일정 응답과 같음. 일정이 없으면 날짜·시각이 null
      properties:
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        doseTimes:
          type: [array, 'null']
          maxItems: 3
          items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        dosePerTime: { type: integer, minimum: 1, maximum: 10 }
        timing: { type: [string, 'null'] }
    ChatProposalConfirmRequest:
      type: object
      properties:
        itemNos:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 10 }
          description: 등록 제안에서 고른 항목 번호. 일정 제안에는 보내지 않음
    ChatProposalConflict:
      description: 기존 공통 오류 모양(`code`·`message`)에 지금 제안 상태 `proposal`을 더함
      type: object
      required: [code, message, proposal]
      properties:
        code:
          type: string
          enum: [PROPOSAL_ALREADY_CONFIRMED, PROPOSAL_CANCELLED, PROPOSAL_EXPIRED, CONFLICT, SCHEDULE_CHANGED]
        message: { type: string }
        proposal: { $ref: '#/components/schemas/ChatProposal' }
