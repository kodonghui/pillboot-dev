<!doctype html>
<!-- 목업(DEC-029 v3-link 카카오 말풍선 · 프로필 바꾸기). 카카오톡 채팅방을 흉내 낸 정적 파일이고 이름 · 코드 · 시각은 모두 지어낸 예시임. 흐린 빠른 답장은 지난 답에 있던 것(실제 앱은 마지막 답에만 보임). 틀(kakao.css)은 v3-3 카카오 목업 것을 그대로 씀. -->
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<title>v3-link 카카오 · 프로필 바꾸기</title>
<link rel="stylesheet" href="../../v3-3/kakao/kakao.css">
</head>
<body>
<div class="room">
  <header class="room__bar">약봉이<small>프로필 바꾸기</small></header>
  <main class="room__msgs">
    <p class="day">2026년 11월 4일 수요일</p>
    <p class="note">— 웹 연결됨 · 지금 프로필 엄마 —</p>
    <div class="me"><p class="bubble">프로필 바꾸기</p><time>오후 4:10</time></div>
    <div class="bot"><span class="avatar" aria-hidden="true">💊</span><div class="bot__body"><b class="bot__name">약봉이</b>
      <div class="bot__row"><p class="bubble">어느 프로필 약으로 답할까요?
1. 엄마 (지금)
2. 아빠
번호나 이름을 보내 주세요.</p><time>오후 4:10</time></div>
      <div class="quick quick--past"><span>엄마</span><span>아빠</span></div>
    </div></div>
    <div class="me"><p class="bubble">아빠</p><time>오후 4:10</time></div>
    <div class="bot"><span class="avatar" aria-hidden="true">💊</span><div class="bot__body"><b class="bot__name">약봉이</b>
      <div class="bot__row"><p class="bubble">이제 ‘아빠’ 프로필 약으로 답해 드려요.</p><time>오후 4:10</time></div>
      <div class="quick"><span>내 약</span><span>도움말</span></div>
    </div></div>
  </main>
</div>
</body></html>
