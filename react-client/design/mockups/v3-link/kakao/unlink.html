<!doctype html>
<!-- 목업(DEC-029 v3-link 카카오 말풍선 · 연결 끊기). 카카오톡 채팅방을 흉내 낸 정적 파일이고 이름 · 코드 · 시각은 모두 지어낸 예시임. 흐린 빠른 답장은 지난 답에 있던 것(실제 앱은 마지막 답에만 보임). 틀(kakao.css)은 v3-3 카카오 목업 것을 그대로 씀. -->
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<title>v3-link 카카오 · 연결 끊기</title>
<link rel="stylesheet" href="../../v3-3/kakao/kakao.css">
</head>
<body>
<div class="room">
  <header class="room__bar">약봉이<small>연결 끊기</small></header>
  <main class="room__msgs">
    <p class="day">2026년 11월 4일 수요일</p>
    <p class="note">— 웹 연결됨 —</p>
    <div class="me"><p class="bubble">연결 끊기</p><time>오후 4:20</time></div>
    <div class="bot"><span class="avatar" aria-hidden="true">💊</span><div class="bot__body"><b class="bot__name">약봉이</b>
      <div class="bot__row"><p class="bubble">웹 계정과의 연결을 끊을까요? 끊으면 다음 메시지부터 그 계정의 약을 쓰지 않아요. 웹의 약목록·상담 기록은 지워지지 않아요.
‘끊기’·‘취소’ 가운데 하나를 보내 주세요.</p><time>오후 4:20</time></div>
      <div class="quick quick--past"><span>끊기</span><span>취소</span></div>
    </div></div>
    <div class="me"><p class="bubble">끊기</p><time>오후 4:21</time></div>
    <div class="bot"><span class="avatar" aria-hidden="true">💊</span><div class="bot__body"><b class="bot__name">약봉이</b>
      <div class="bot__row"><p class="bubble">연결을 끊었어요. 다시 쓰려면 웹에서 새 코드를 받아 보내 주세요.</p><time>오후 4:21</time></div>
    </div></div>
  </main>
</div>
</body></html>
